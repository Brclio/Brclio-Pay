plugins { id 'com.android.application' }

def releaseSettings = new groovy.json.JsonSlurper().parse(file('../../shared/release-settings.json'))
def clientVersionName = project.findProperty('clientVersionName') ?: releaseSettings.version
if (!(clientVersionName ==~ /(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})/)) throw new GradleException('Invalid shared client version')
def versionParts = clientVersionName.split('\\.').collect { it.toInteger() }
def clientVersionCode = project.findProperty('clientVersionCode')?.toLong() ?: versionParts[0] * 1000000L + versionParts[1] * 1000L + versionParts[2]
if (clientVersionCode <= 0 || clientVersionCode > 2100000000) throw new GradleException('Android client version exceeds supported range')
def signingKeys = ['ANDROID_SIGNING_STORE_FILE', 'ANDROID_SIGNING_STORE_PASSWORD', 'ANDROID_SIGNING_KEY_ALIAS', 'ANDROID_SIGNING_KEY_PASSWORD']
def signingValues = signingKeys.collectEntries { [(it): System.getenv(it)] }
def hasReleaseSigning = signingValues.values().every { it != null && !it.isBlank() }
def sharedAssets = layout.buildDirectory.dir('generated/sharedAssets')
def syncSharedAssets = tasks.register('syncSharedAssets', Sync) {
    from('../../shared') { include 'release-settings.json', 'update-public-key.pem' }
    into sharedAssets
    doFirst {
        ['release-settings.json', 'update-public-key.pem'].each { name ->
            if (!file('../../shared/' + name).isFile()) throw new GradleException('Missing shared release verification resource: ' + name)
        }
    }
}
def brandingResources = layout.buildDirectory.dir('generated/brandingResources')
def syncBrandingResources = tasks.register('syncBrandingResources', Sync) {
    from('../../shared/icon.png') { rename 'icon.png', 'app_icon.png'; into 'drawable-nodpi' }
    into brandingResources
    doFirst { if (!file('../../shared/icon.png').isFile()) throw new GradleException('Missing shared Brclio Pay icon') }
}

android {
    namespace 'cn.bornforthis.brcliopay'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId releaseSettings.applicationId
        minSdk 26
        targetSdk 35
        versionCode clientVersionCode.toInteger()
        versionName clientVersionName
    }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir(sharedAssets)
    sourceSets.main.res.srcDir(brandingResources)
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(signingValues.ANDROID_SIGNING_STORE_FILE)
                storePassword signingValues.ANDROID_SIGNING_STORE_PASSWORD
                keyAlias signingValues.ANDROID_SIGNING_KEY_ALIAS
                keyPassword signingValues.ANDROID_SIGNING_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            debuggable false
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true; checkReleaseBuilds true; warningsAsErrors false }
    testOptions { unitTests.returnDefaultValues = true }
}
tasks.named('preBuild').configure { dependsOn syncSharedAssets, syncBrandingResources }
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !hasReleaseSigning)
        throw new GradleException('Release build requires all four ANDROID_SIGNING_* environment variables.')
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
