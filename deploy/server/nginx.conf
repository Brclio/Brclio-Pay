# BaoTa Nginx example. Replace domains and certificate paths before installation.
# Add the legacy hostname only when LEGACY_WECHAT_BASE_URL and the certificate
# include it. Keep the app, database, configuration and backups outside webroot.
server {
    listen 80;
    server_name pay.example.com;
    # Optional legacy hostname: paywc.example.com
    access_log off;
    error_log /www/wwwlogs/brclio-pay.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/brclio-pay-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pay.example.com;
    # Optional legacy hostname: paywc.example.com
    ssl_certificate /www/server/panel/vhost/cert/pay.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/pay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BrclioPaySSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # Checkout paths and query strings can identify orders; do not access-log them.
    access_log off;
    error_log /www/wwwlogs/brclio-pay.error.log warn;
    client_max_body_size 256k;
    client_body_timeout 30s;
    keepalive_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:3187;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }
}
