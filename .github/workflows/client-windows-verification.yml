# Diagnostic-only branch: never rebuilds, signs, loads private credentials, or publishes a release.
name: Reverify pinned signed Windows installer
on:
  workflow_dispatch:
    inputs:
      probeOnly:
        description: Verify only temporary CurrentUser trust without NSIS installation
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify original build source and artifact before extracting exact signed installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $api='https://api.github.com/repos/Brclio/Brclio-Pay'
          $run=Invoke-RestMethod -Uri "$api/actions/runs/39717039848" -Headers $headers
          if ($run.head_sha -cne '1d5c981361ace4fe49931ad40934043e180d3ad7' -or $run.status -ne 'completed' -or $run.conclusion -ne 'cancelled') { throw 'Original build source or terminal state mismatch.' }
          $jobs=(Invoke-RestMethod -Uri "$api/actions/runs/39717039848/jobs" -Headers $headers).jobs
          $steps=@($jobs | ForEach-Object { $_.steps } | Where-Object { $_.name -eq 'Build signed current installer, launcher and NSIS uninstaller' -and $_.conclusion -eq 'success' })
          if ($steps.Count -ne 1) { throw 'Original signed build did not succeed.' }
          $artifact=Invoke-RestMethod -Uri "$api/actions/artifacts/12400106654" -Headers $headers
          if ($artifact.id -ne 12400106654 -or $artifact.name -ne 'windows-client-verified' -or $artifact.expired -or $artifact.size_in_bytes -ne 111425186 -or $artifact.digest -cne 'sha256:e499d23204dd03be307ae5e50867f677f5486a592061a92edddaa153a092215c' -or $artifact.workflow_run.id -ne 39717039848 -or $artifact.workflow_run.head_sha -cne $run.head_sha) { throw 'Original artifact identity mismatch.' }
          $archive=Join-Path $env:RUNNER_TEMP 'original-signed-windows.zip'
          Invoke-WebRequest -Uri "$api/actions/artifacts/12400106654/zip" -Headers $headers -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne 111425186 -or (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -cne 'e499d23204dd03be307ae5e50867f677f5486a592061a92edddaa153a092215c') { throw 'Original artifact archive checksum mismatch.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $allowed=@('dist-clients/Brclio-Pay-1.0.1-windows-x64-setup.exe','artifacts/windows-native/windows-before-upgrade.json','artifacts/windows-native/windows-after-upgrade.json','artifacts/windows-native/windows-native-evidence.json','artifacts/windows-native/windows-signing-evidence.json')
            $names=@($zip.Entries | ForEach-Object { $_.FullName })
            if ($names.Count -ne @($names | Select-Object -Unique).Count -or @($names | Where-Object { $_ -cnotin $allowed }).Count -ne 0) { throw 'Unexpected original artifact entries.' }
            $entry=$zip.GetEntry('dist-clients/Brclio-Pay-1.0.1-windows-x64-setup.exe')
            if ($null -eq $entry -or $entry.Length -lt 100000000 -or $entry.Length -gt 150000000) { throw 'Exact original installer missing.' }
            New-Item -ItemType Directory -Force -Path 'dist-clients','artifacts/windows-native' | Out-Null
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,(Join-Path (Get-Location) 'dist-clients/Brclio-Pay-1.0.1-windows-x64-setup.exe'),$false)
          } finally { $zip.Dispose() }
          $installer='dist-clients/Brclio-Pay-1.0.1-windows-x64-setup.exe'
          if ((Get-Item -LiteralPath $installer).Length -ne 111423264 -or (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant() -cne 'd8227773e0689af5b1416dbb92c11091065bdc8fc670ada4e3aa65de72cd7986') { throw 'Original signed installer bytes mismatch.' }
          [ordered]@{schema=1;applicationSourceRevision=$run.head_sha;verifierRevision=$env:GITHUB_SHA;originalBuildRun=$run.html_url;originalArtifactId='12400106654';originalArtifactSha256='e499d23204dd03be307ae5e50867f677f5486a592061a92edddaa153a092215c';installerSha256='d8227773e0689af5b1416dbb92c11091065bdc8fc670ada4e3aa65de72cd7986';rebuildPerformed=$false;privateSigningIdentityLoaded=$false} | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/windows-native/windows-build-origin.json
          Write-Host 'Pinned original source, archive, and signed installer bytes verified; no rebuild or signing.'
      - name: Probe fixed public certificate with bounded physical CurrentUser trust
        shell: pwsh
        run: ./clients/ci/windows-trust-probe.ps1 -Installer 'dist-clients/Brclio-Pay-1.0.1-windows-x64-setup.exe' -OutputDirectory 'artifacts/windows-native'
      - name: Download exact published unsigned upgrade seed
        if: ${{ !inputs.probeOnly }}
        shell: pwsh
        run: |
          $directory=Join-Path $env:RUNNER_TEMP 'brcliopay-seed'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $seed=Join-Path $directory 'Brclio-Pay-1.0.0-windows-x64-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/Brclio/Brclio-Pay/releases/download/client-v1.0.0/Brclio-Pay-1.0.0-windows-x64-setup.exe' -OutFile $seed
          if ((Get-Item -LiteralPath $seed).Length -ne 111396777 -or (Get-FileHash -Algorithm SHA256 -LiteralPath $seed).Hash.ToLowerInvariant() -cne '1656c5c3c622aca87f1427f62b6e800cdefbb23650c63e23ae500de1f176c588') { throw 'Published unsigned upgrade seed checksum mismatch.' }
      - name: Reverify bounded native installation, live smoke, profile retention and strict trust transitions
        if: ${{ !inputs.probeOnly }}
        shell: pwsh
        run: ./clients/scripts/verify-windows-client.ps1 -SeedInstaller "${{ runner.temp }}/brcliopay-seed/Brclio-Pay-1.0.0-windows-x64-setup.exe" -Installer 'dist-clients/Brclio-Pay-1.0.1-windows-x64-setup.exe' -OutputDirectory 'artifacts/windows-native' -SeedVersion '1.0.0' -ApplicationSourceRevision '1d5c981361ace4fe49931ad40934043e180d3ad7' -OriginalBuildRun 'https://github.com/Brclio/Brclio-Pay/actions/runs/39717039848' -OriginalArtifactId '12400106654' -OriginalArtifactSha256 'e499d23204dd03be307ae5e50867f677f5486a592061a92edddaa153a092215c' -ExpectedInstallerSha256 'd8227773e0689af5b1416dbb92c11091065bdc8fc670ada4e3aa65de72cd7986'
      - name: Upload exact original signed installer and public native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-reverification
          path: |
            dist-clients/Brclio-Pay-1.0.1-windows-x64-setup.exe
            artifacts/windows-native/*.json
          if-no-files-found: error
          retention-days: 7
