# Manual, read-only repository verification. Signing secrets are scoped to the provisioning step.
# Private PFX/password live only in the runner's restricted temp directory/environment, never in artifacts.
name: Verify Windows client
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - name: Install desktop dependencies before loading signing credentials
        run: npm ci --prefix clients/desktop
      - name: Verify updater policies
        run: node --test tests/client-desktop.test.mjs tests/client-android.test.mjs
      - name: Read client version
        id: settings
        shell: pwsh
        run: |
          $settings = Get-Content -Raw clients/shared/release-settings.json | ConvertFrom-Json
          if ($settings.version -notmatch '^\d{1,3}\.\d{1,3}\.\d{1,3}$' -or $settings.applicationId -ne 'cn.bornforthis.brcliopay') { throw 'Invalid shared client identity.' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT,"version=$($settings.version)`n")
      - name: Download exact previously released unsigned installation seed
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'brcliopay-seed'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $seed = Join-Path $directory 'Brclio-Pay-1.0.0-windows-x64-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/Brclio/Brclio-Pay/releases/download/client-v1.0.0/Brclio-Pay-1.0.0-windows-x64-setup.exe' -OutFile $seed
          if ((Get-Item -LiteralPath $seed).Length -ne 111396777 -or (Get-FileHash -Algorithm SHA256 -LiteralPath $seed).Hash.ToLowerInvariant() -cne '1656c5c3c622aca87f1427f62b6e800cdefbb23650c63e23ae500de1f176c588') { throw 'Published upgrade seed integrity mismatch.' }
      - name: Provision pinned private signing identity in restricted temporary directory
        shell: pwsh
        env:
          BRCLIO_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.BRCLIO_WINDOWS_SIGNING_PFX_BASE64 }}
          BRCLIO_WINDOWS_SIGNING_PASSWORD: ${{ secrets.BRCLIO_WINDOWS_SIGNING_PASSWORD }}
        run: ./clients/scripts/prepare-windows-signing.ps1
      - name: Build signed current installer, launcher and NSIS uninstaller
        working-directory: clients/desktop
        run: npx electron-builder --win --x64 --publish never
      - name: Verify untrusted and current-user trust states plus native unsigned-to-signed upgrade
        shell: pwsh
        run: ./clients/scripts/verify-windows-client.ps1 -SeedInstaller "${{ runner.temp }}/brcliopay-seed/Brclio-Pay-1.0.0-windows-x64-setup.exe" -Installer "dist-clients/Brclio-Pay-${{ steps.settings.outputs.version }}-windows-x64-setup.exe" -OutputDirectory "artifacts/windows-native" -SeedVersion '1.0.0'
      - name: Remove private signing material before uploading public artifacts
        if: always()
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'brcliopay-windows-private-signing'
          if (Test-Path -LiteralPath $directory) { Remove-Item -LiteralPath $directory -Recurse -Force }
          [IO.File]::AppendAllText($env:GITHUB_ENV,"WIN_CSC_LINK=`nWIN_CSC_KEY_PASSWORD=`n")
      - name: Upload only public signed installer and safe verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-client-verified
          path: |
            dist-clients/Brclio-Pay-${{ steps.settings.outputs.version }}-windows-x64-setup.exe
            artifacts/windows-native/*.json
          if-no-files-found: error
          retention-days: 7
