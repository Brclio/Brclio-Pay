# Mirror of the manual verification workflow installed in .github/workflows/.
# No signing keys, payment credentials, deployment token or write token is used.
name: Verify Windows client
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm ci --prefix clients/desktop
      - name: Verify updater policies
        run: node --test tests/client-desktop.test.mjs tests/client-android.test.mjs
      - name: Build previous-version installation fixture
        working-directory: clients/desktop
        run: npx electron-builder --win --x64 --publish never --config.extraMetadata.version=0.9.9 --config.win.signAndEditExecutable=true "--config.directories.output=${{ runner.temp }}/brcliopay-seed"
      - name: Build current installer
        working-directory: clients/desktop
        run: npx electron-builder --win --x64 --publish never --config.win.signAndEditExecutable=true
      - name: Verify native installation and upgrade
        shell: pwsh
        run: ./clients/scripts/verify-windows-client.ps1 -SeedInstaller "${{ runner.temp }}/brcliopay-seed/Brclio-Pay-0.9.9-windows-x64-setup.exe" -Installer "dist-clients/Brclio-Pay-1.0.0-windows-x64-setup.exe" -OutputDirectory "artifacts/windows-native"
      - name: Upload installer and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-client-verified
          path: |
            dist-clients/Brclio-Pay-1.0.0-windows-x64-setup.exe
            artifacts/windows-native/*.json
          if-no-files-found: error
          retention-days: 7
